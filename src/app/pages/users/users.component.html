<h1>Users</h1>

<input class="search" type="search" placeholder="Search by name or email…" [formControl]="search" />

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Role</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody>
    @for (user of users; track user.id) {
      <tr>
        <td>
          <a [routerLink]="['/users', user.id]">{{ user.name }}</a>
        </td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
        <td>
          <span class="status-pill {{ user.status }}">{{ user.status }}</span>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4" class="empty">No users found</td>
      </tr>
    }
  </tbody>
</table>
