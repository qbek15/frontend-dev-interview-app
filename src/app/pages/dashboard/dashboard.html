<h1>Dashboard</h1>

@if (users()) {
  <div class="cards">
    <div class="card">
      <span class="label">Total users</span>
      <span class="value">{{ stats().total }}</span>
    </div>
    <div class="card">
      <span class="label">Active users</span>
      <span class="value">{{ stats().active }}</span>
    </div>
    <div class="card">
      <span class="label">Admins</span>
      <span class="value">{{ stats().admins }}</span>
    </div>
  </div>
} @else {
  <p>Loading…</p>
}
