<a routerLink="/users" class="back">← Back to users</a>

@if (user$ | async; as user) {
  <div class="header">
    <h1>{{ user.name }}</h1>
    <a routerLink="edit" class="button">Edit</a>
  </div>

  <dl class="details">
    <dt>Email</dt>
    <dd>{{ user.email }}</dd>

    <dt>Role</dt>
    <dd>{{ user.role }}</dd>

    <dt>Status</dt>
    <dd>
      <span class="status-pill {{ user.status }}">{{ user.status }}</span>
    </dd>

    <dt>Created</dt>
    <dd>{{ user.createdAt | date: 'longDate' }}</dd>
  </dl>
} @else {
  <p>Loading…</p>
}
